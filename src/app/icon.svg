<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12"/>

  <!-- Inner Subtle Halo -->
  <circle cx="256" cy="256" r="180" fill="#f59e0b" fill-opacity="0.04"/>

  <!-- Monogram JG (Styled Vector Geometry) -->
  <g filter="url(#goldGlow)">
    <!-- Letter J -->
    <path d="M 210 160 L 250 160 L 250 295 C 250 335 225 352 185 352 C 150 352 135 338 130 320 L 165 305 C 168 314 175 322 185 322 C 205 322 215 312 215 292 L 215 160 Z" fill="url(#goldGrad)"/>

    <!-- Letter G -->
    <path d="M 375 220 L 342 235 C 333 205 312 190 282 190 C 235 190 200 228 200 276 C 200 324 235 362 282 362 C 322 362 346 338 350 300 L 290 300 L 290 270 L 385 270 L 385 310 C 378 360 338 395 282 395 C 215 395 165 342 165 276 C 165 210 215 157 282 157 C 326 157 362 182 375 220 Z" fill="url(#goldGrad)"/>
    
    <!-- Gold Dot / Sparkle Accent -->
    <circle cx="395" cy="155" r="14" fill="#fbbf24"/>
  </g>
</svg>
